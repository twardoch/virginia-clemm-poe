# this_file: .github/workflows/docs.yml
name: Build Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'src_docs/**'
      - 'src/virginia_clemm_poe/data/poe_bots.json'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src_docs/**'
      - 'src/virginia_clemm_poe/data/poe_bots.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip uv
        uv sync --locked

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    
    - name: Update documentation data
      run: |
        cd src_docs
        uv run python update_docs.py
    
    - name: Build MkDocs site
      run: |
        cd src_docs
        uv run mkdocs build --clean --strict
    
    - name: Add .nojekyll file
      run: |
        touch docs/.nojekyll
    
    # GitHub Pages publishes the committed main/docs directory.
